name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: aqua_test, POSTGRES_USER: aqua, POSTGRES_PASSWORD: aqua }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aqua" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pdo_sqlite, intl, gd, zip, redis
          coverage: none
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Tests (SQLite)
        run: php artisan test
      - name: Migrations + seed on PostgreSQL
        env: { DB_CONNECTION: pgsql, DB_HOST: 127.0.0.1, DB_DATABASE: aqua_test, DB_USERNAME: aqua, DB_PASSWORD: aqua, CACHE_STORE: array, FRONTEND_REVALIDATE_URL: "" }
        run: php artisan migrate:fresh --seed --force

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Build (renders from the committed API snapshot)
        env:
          API_INTERNAL_URL: http://127.0.0.1:9/api/v1
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f infrastructure/docker/backend/Dockerfile -t mineral-water/backend:ci .
      - run: docker build -f infrastructure/docker/frontend/Dockerfile -t mineral-water/frontend:ci .
