# Reverse proxy for the whole stack (one domain):
#   /api/v1/*  -> Laravel (PHP-FPM)      /storage/* -> uploaded files (static)
#   /up        -> Laravel health check   everything else -> Next.js
# TLS: install.sh renders ssl.conf.template (Let's Encrypt) or terminate TLS at the CDN.

upstream nextjs { server frontend:3000; keepalive 32; }

limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=forms:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name _;

    include /etc/nginx/snippets/site.conf;
}

# Internal API listener for Next.js server-side rendering (not published to the host).
# No Nginx rate limits here; Laravel exempts private addresses from the public limiter.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    location /api/v1/ { include /etc/nginx/snippets/laravel.conf; }
    location / { return 404; }
}
