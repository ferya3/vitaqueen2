# Shared site configuration, included by the HTTP (default.conf) and HTTPS (ssl.conf) servers.

server_tokens off;
client_max_body_size 110m;
root /var/www/html/public;

# ----------------------------------------------------- security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# ------------------------------------------------------------- gzip
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

# ------------------------------------------------------ Laravel API
location = /api/v1/admin/auth/login {
    limit_req zone=login burst=5 nodelay;
    include /etc/nginx/snippets/laravel.conf;
}
location ~ ^/api/v1/(representatives|contact)$ {
    limit_req zone=forms burst=5 nodelay;
    include /etc/nginx/snippets/laravel.conf;
}
location /api/v1/ {
    limit_req zone=api burst=60 nodelay;
    include /etc/nginx/snippets/laravel.conf;
}
location = /up {
    include /etc/nginx/snippets/laravel.conf;
}

# ----------------------------------------------------- uploaded media
location /storage/ {
    alias /var/www/html/storage/app/public/;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Uploaded files are never executed.
    location ~* \.(php|phtml|html?|svg)$ { return 403; }
}

# ------------------------------------------- Next.js immutable assets
location /_next/static/ {
    proxy_pass http://nextjs;
    proxy_set_header Host $host;
    expires 365d;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# ------------------------------------------------------------ Next.js
location / {
    proxy_pass http://nextjs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_buffering off; # stream React Server Component responses
}
